<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" data-pivot-x="400" data-pivot-y="480" data-max-open-angle="24" data-open-amount="0" role="img">
<title>Stork Snips</title><desc>Gold embroidery stork scissors: the long thin beak is the blades, the head sits on the pivot (the screw is its eye), an engraved wing and tail on the body, the legs curl into two small finger rings. Closed default pose. Beak tips face up.</desc>
<!-- Two rigid halves about (400,480): blade-left (back beak half + right leg ring) opens by -24 x openAmount degrees,
     blade-right (front beak half + head, body, wing and left leg ring) by +24 x openAmount. The eye (pivot) is stationary. -->
