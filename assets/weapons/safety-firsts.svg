<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" data-pivot-x="400" data-pivot-y="440" data-max-open-angle="26" data-open-amount="0" role="img" aria-labelledby="safety-title safety-desc">
<title id="safety-title">Safety Firsts</title><desc id="safety-desc">Kindergarten safety scissors: short stubby steel blades with round blunt tips, chunky glossy plastic loop handles (a big red oval and a small blue ring), a gold star rivet at the pivot. Two rigid moving halves; transparent background.</desc>
<!-- CLOSED POSE. Coordinates are SVG user units. Blade tips face up.
     Each rotating group includes its own blade AND opposite-side handle; it turns by data-open-sign x 26 degrees
     about (400, 440). Static layers stay fixed. -->
<defs>
  <linearGradient id="safety-steel" x1="0%" y1="0%" x2="100%" y2="10%"><stop offset="0" stop-color="#6d7f8c"/><stop offset=".3" stop-color="#dfe7ea"/><stop offset=".55" stop-color="#a9b8bf"/><stop offset=".8" stop-color="#eef3f2"/><stop offset="1" stop-color="#8697a2"/></linearGradient>
  <linearGradient id="safety-red" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0" stop-color="#ff7a5c"/><stop offset=".45" stop-color="#e2402f"/><stop offset="1" stop-color="#a8231a"/></linearGradient>
  <linearGradient id="safety-blue" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0" stop-color="#6fb4ff"/><stop offset=".45" stop-color="#2f74d9"/><stop offset="1" stop-color="#1b4a99"/></linearGradient>
  <radialGradient id="safety-gold" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#ffc93d"/><stop offset="1" stop-color="#c98a12"/></radialGradient>
</defs>
