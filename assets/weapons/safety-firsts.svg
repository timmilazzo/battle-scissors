  <path d="M366 420C361 350 368 284 384 232" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="5"/>
  <path d="M400 440C422 500 448 556 470 604" fill="none" stroke="#2a2f3a" stroke-width="66"/>
  <path d="M400 440C422 500 448 556 470 604" fill="none" stroke="url(#safety-red)" stroke-width="54"/>
  <ellipse cx="512" cy="724" rx="96" ry="118" transform="rotate(-18 512 724)" fill="none" stroke="#2a2f3a" stroke-width="58"/>
  <ellipse cx="512" cy="724" rx="96" ry="118" transform="rotate(-18 512 724)" fill="none" stroke="url(#safety-red)" stroke-width="46"/>
  <path d="M430 660C446 628 474 606 506 600" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="9"/>
  <path d="M412 470C426 510 440 540 452 566" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="8"/>
</g>
<g id="blade-right" data-role="rotating" data-pivot-x="400" data-pivot-y="440" data-open-sign="1" transform="rotate(0 400 440)" stroke-linecap="round" stroke-linejoin="round">
  <path d="M450 460C458 384 450 292 428 222A30 30 0 0 0 372 212C380 284 388 364 388 460Z" fill="url(#safety-steel)" stroke="#2a2f3a" stroke-width="6"/>
  <path d="M434 420C439 350 432 284 416 232" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="5"/>
  <path d="M400 440C382 498 360 552 342 598" fill="none" stroke="#2a2f3a" stroke-width="66"/>
  <path d="M400 440C382 498 360 552 342 598" fill="none" stroke="url(#safety-blue)" stroke-width="54"/>
