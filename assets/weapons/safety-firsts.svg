  <path d="M400 422L405.3 432.7 417.1 434.4 408.6 442.7 410.6 454.4 400 448.9 389.4 454.4 391.4 442.7 382.9 434.4 394.7 432.7Z" fill="#fff6d0" stroke="#c98a12" stroke-width="2"/>
