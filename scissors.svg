<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <!-- Closed pose. Pivot at (200,400). Open by rotating #blade-left negative, #blade-right positive. -->
  <defs>
    <filter id="glow" x="-60%" y="-20%" width="220%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="tight"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="wide"/>
      <feMerge>
        <feMergeNode in="wide"/>
        <feMergeNode in="tight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ff7ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1aa7c9" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="gem" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#7ff3ff"/>
      <stop offset="1" stop-color="#0a6f9a"/>
    </radialGradient>
  </defs>

  <g id="blade-left" style="transform-origin:200px 400px;transform-box:view-box" filter="url(#glow)"
     stroke="#c4faff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M206 404C208 310 206 190 200 80C188 150 170 250 168 340C167 370 176 395 190 408Z" fill="url(#steel)"/>
    <path d="M186 380C184 300 188 200 199 120" fill="none" stroke="#eaffff" stroke-width="1.2" stroke-opacity="0.55"/>
    <path d="M188 404C196 430 214 460 226 488L252 487C236 456 222 424 212 396Z" fill="#6ff3ff" fill-opacity="0.22"/>
    <path d="M204 532a36 48 0 1 0 72 0a36 48 0 1 0-72 0ZM216 532a24 35 0 1 0 48 0a24 35 0 1 0-48 0Z" fill="#6ff3ff" fill-opacity="0.22" fill-rule="evenodd"/>
    <circle cx="200" cy="400" r="20" fill="#0e5f7a" fill-opacity="0.45"/>
    <circle cx="200" cy="400" r="15" fill="none" stroke-width="1.2" stroke-dasharray="2 5" stroke-opacity="0.8"/>
  </g>

  <g id="blade-right" style="transform-origin:200px 400px;transform-box:view-box" filter="url(#glow)"
     stroke="#c4faff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M194 404C192 310 194 190 200 80C212 150 230 250 232 340C233 370 224 395 210 408Z" fill="url(#steel)"/>
    <path d="M214 380C216 300 212 200 201 120" fill="none" stroke="#eaffff" stroke-width="1.2" stroke-opacity="0.55"/>
    <path d="M212 404C204 430 186 460 174 488L148 487C164 456 178 424 188 396Z" fill="#6ff3ff" fill-opacity="0.22"/>
    <path d="M124 532a36 48 0 1 0 72 0a36 48 0 1 0-72 0ZM136 532a24 35 0 1 0 48 0a24 35 0 1 0-48 0Z" fill="#6ff3ff" fill-opacity="0.22" fill-rule="evenodd"/>
    <circle cx="200" cy="400" r="20" fill="#0e5f7a" fill-opacity="0.45"/>
    <circle cx="200" cy="400" r="12" fill="none" stroke-width="1.2" stroke-dasharray="5 3" stroke-opacity="0.8"/>
  </g>

  <circle id="pivot" cx="200" cy="400" r="7" fill="url(#gem)" stroke="#f0ffff" stroke-width="1.5" filter="url(#glow)"/>
</svg>
