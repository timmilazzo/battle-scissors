<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level Lab</title>
<!-- Dev tool: type a road recipe (see src/levelGen.js), see the generated plate, then play it. Run from the dev server
     (node tools/serve.js), open /tools/level-lab.html. Not part of the deployed site. -->
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #1b1512; color: #f3e6c8; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px; background: #2c1e14; position: sticky; top: 0; z-index: 2; }
  input[type=text] { flex: 1 1 320px; font: 15px ui-monospace, Consolas, monospace; padding: 7px 9px; background: #120d0a; color: #f3e6c8; border: 1px solid #6b4a2e; border-radius: 6px; }
  input[type=number] { width: 90px; padding: 7px; background: #120d0a; color: #f3e6c8; border: 1px solid #6b4a2e; border-radius: 6px; }
  button, a.btn { font: inherit; padding: 7px 12px; border-radius: 6px; border: 1px solid #c99a3e; background: #5a3a1c; color: #ffe4aa; cursor: pointer; text-decoration: none; }
  label { display: inline-flex; gap: 4px; align-items: center; }
  main { display: flex; flex-wrap: wrap; gap: 12px; padding: 12px; }
  .cell { display: flex; flex-direction: column; gap: 6px; }
  .cell canvas { height: min(80vh, 900px); border-radius: 8px; box-shadow: 0 4px 18px #000; }
  .grid .cell canvas { height: 46vh; }
  .meta { font: 12px ui-monospace, Consolas, monospace; max-width: 520px; white-space: pre-wrap; color: #d9c7a0; }
  .warn { color: #ff9a6a; }
  #help { font: 12px ui-monospace, Consolas, monospace; color: #bfa98a; padding: 0 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <input id="recipe" type="text" value="zigzag 2, fork pin, s" spellcheck="false" aria-label="Recipe">
  <label>seed <input id="seed" type="number" value="1"></label>
  <button id="build">Build</button>
  <button id="random">Random recipe</button>
  <button id="six">6 seeds</button>
  <label><input id="overlay" type="checkbox" checked> routes + pads</label>
  <a id="play" class="btn" target="_blank">Play it ›</a>
</header>
<div id="help">segments: straight · bend [left|right|center] · s [left|right] [amp] · wave [n] · wiggle [n] · zigzag [n] [left|right] · fork [wide|narrow] [pin] · start left|right|center</div>
<main id="out"></main>
<script type="module">
  import { CONFIG as C } from '../src/config.js';
  import { buildLevel, randomRecipe, curve } from '../src/levelGen.js';
  import { loadKit, paintLevel } from '../src/levelArt.js';

  const $ = id => document.getElementById(id), out = $('out');
  function view(def) {
    const plate = paintLevel(def), c = document.createElement('canvas');
    c.width = def.w; c.height = def.h;
    const g = c.getContext('2d');
    g.drawImage(plate, 0, 0);
    if ($('overlay').checked) {
      def.paths.forEach((P, i) => {
        g.strokeStyle = ['#ff3b3b', '#3bff7a', '#3bb4ff', '#ffd23f'][i % 4]; g.lineWidth = 3; g.setLineDash([]);
        g.beginPath(); curve(P, 12).forEach(([x, y], k) => (k ? g.lineTo(x, y) : g.moveTo(x, y))); g.stroke();
      });
      g.strokeStyle = 'rgba(255,255,255,0.8)'; g.setLineDash([8, 8]); g.lineWidth = 2;
      for (const [x, y] of def.spots) { g.beginPath(); g.arc(x, y, C.towers.needle.radius, 0, Math.PI * 2); g.stroke(); }
      g.setLineDash([]); g.strokeStyle = 'rgba(255,0,255,0.5)';                  // narrow-phone crop (360 x 780)
      const crop = (941 - 360 * 1672 / 780) / 2; g.strokeRect(crop, 0, 941 - 2 * crop, 1672);
    }
    const cell = document.createElement('div'); cell.className = 'cell';
    const meta = document.createElement('div'); meta.className = 'meta';
    meta.innerHTML = '<b>' + def.recipe + '</b>  seed ' + def.seed + '\nroutes ' + def.paths.length + ', pads ' + def.spots.length +
      (def.warnings.length ? '\n<span class="warn">' + def.warnings.join('\n') + '</span>' : '');
    cell.append(c, meta);
    return cell;
  }
  function playLink(recipe, seed) { $('play').href = '../index.html?recipe=' + encodeURIComponent(recipe) + '&seed=' + seed; }
  function build() {
    const recipe = $('recipe').value, seed = +$('seed').value || 1;
    out.className = ''; out.replaceChildren(view(buildLevel(recipe, seed)));
    playLink(recipe, seed);
    history.replaceState(null, '', '?recipe=' + encodeURIComponent(recipe) + '&seed=' + seed);
  }
  $('build').onclick = build;
  $('recipe').onkeydown = e => { if (e.key === 'Enter') build(); };
  $('overlay').onchange = build;
  $('random').onclick = () => { const s = (Math.random() * 1e6) | 0; $('seed').value = s; $('recipe').value = randomRecipe(s); build(); };
  $('six').onclick = () => {
    const recipe = $('recipe').value, s0 = +$('seed').value || 1;
    out.className = 'grid'; out.replaceChildren(...[0, 1, 2, 3, 4, 5].map(i => view(buildLevel(recipe, s0 + i))));
  };
  const q = new URLSearchParams(location.search);
  if (q.get('recipe')) $('recipe').value = q.get('recipe');
  if (q.get('seed')) $('seed').value = q.get('seed');
  loadKit().then(build);
</script>
</body>
</html>
