# Deploys the game to GitHub Pages on every push to main. No build step: the site is the repo's runtime files as-is.
# One-time setup: repo Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Only what the game loads at runtime; dev tooling, docs and the legacy prototype stay out of the site.
      - name: Stage site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest src vendor assets _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
